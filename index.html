const HABIT_DEFAULTS=[["Chưa", "Chưa", "N/A", "Chưa", "Chưa", "Chưa", "Chưa", "Chưa"], ["Chưa", "N/A", "N/A", "N/A", "Chưa", "Chưa", "Chưa", "Chưa"], ["N/A", "Chưa", "Chưa", "N/A", "Chưa", "Chưa", "Chưa", "Chưa"], ["N/A", "N/A", "N/A", "N/A", "Chưa", "Chưa", "Chưa", "Chưa"], ["Chưa", "N/A", "N/A", "Chưa", "Chưa", "Chưa", "Chưa", "Chưa"], ["Chưa", "N/A", "N/A", "N/A", "Chưa", "Chưa", "Chưa", "Chưa"], ["Chưa", "Chưa", "Chưa", "Chưa", "Chưa", "Chưa", "Chưa", "Chưa"]];
const DAYS=['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'];
const SHORT=['T2','T3','T4','T5','T6','T7','CN'];
const CATEGORIES=['Lớp học','Tự học','Nghiên cứu','Calisthenics','Việc nhà','Sinh hoạt','Nghỉ ngơi','Di chuyển','Phát triển'];
const CAT_CLASS={'Lớp học':'class','Tự học':'self','Nghiên cứu':'research','Calisthenics':'workout','Việc nhà':'house','Sinh hoạt':'life','Nghỉ ngơi':'rest','Di chuyển':'travel','Phát triển':'develop'};
const ICONS={dashboard:'▦',calendar:'▤',tasks:'☑',habits:'◈',settings:'⚙'};
const NAV=[['dashboard','Tổng quan'],['calendar','Lịch tuần'],['tasks','Công việc'],['habits','Thói quen'],['settings','Cài đặt']];
const STORE_KEY='nhip-tuan-app-2026-v1';
const defaultData=()=>({version:1,activities:SEED_ACTIVITIES.map(x=>({...x})),progress:{},habitProgress:{},settings:{studyGoal:30,workoutGoal:3}});
let state=loadData();let view='dashboard';let calendarMode=innerWidth<750?'day':'week';let selectedDay=(new Date().getDay()+6)%7;let weekStart=monday(new Date());let taskSearch='';let taskCategory='Tất cả';let taskStatus='Tất cả';let modalId=null;let toastTimeout;
function loadData(){try{let x=JSON.parse(localStorage.getItem(STORE_KEY));if(x&&Array.isArray(x.activities)&&x.progress&&x.habitProgress){x.settings=x.settings||{studyGoal:30,workoutGoal:3};return x;}}catch(e){}return defaultData()}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state))}catch(e){toast('Trình duyệt không cho lưu dữ liệu. Hãy xuất bản sao JSON.')}}
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function mins(v){let p=String(v).split(':').map(Number);return p[0]*60+p[1]}
function duration(e){return Math.max(0,mins(e.end)-mins(e.start))}
function fmtHours(m){return (Math.round(m/60*10)/10).toLocaleString('vi-VN',{maximumFractionDigits:1})}
function monday(x){const d=new Date(x.getFullYear(),x.getMonth(),x.getDate());d.setDate(d.getDate()-(d.getDay()+6)%7);return d}
function dateAt(day){let x=new Date(weekStart);x.setDate(x.getDate()+day);return x}
function keyDate(d){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function weekKey(){return keyDate(weekStart)}
function dateLabel(d){return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
function activeStatus(e){return (state.progress[weekKey()]||{})[e.id]||'Chưa bắt đầu'}
function done(e){return activeStatus(e)==='Hoàn thành'}
function dailyEvents(i){return state.activities.filter(e=>e.day===i).sort((a,b)=>mins(a.start)-mins(b.start)||mins(a.end)-mins(b.end))}
function totalMinutes(filter,finished=false){return state.activities.filter(e=>filter(e)&&(finished?done(e):true)).reduce((n,e)=>n+duration(e),0)}
function countDone(filter){return state.activities.filter(e=>filter(e)&&done(e)).length}
function pct(a,b){return b?Math.round(100*a/b):0}
function weekRange(){let e=dateAt(6);return `${dateLabel(weekStart)} – ${dateLabel(e)}/${e.getFullYear()}`}
function isToday(i){return keyDate(dateAt(i))===keyDate(new Date())}
function markStatus(id,s){(state.progress[weekKey()] ||= {})[id]=s;save();render()}
function toggleTask(id){let e=state.activities.find(x=>x.id===id);if(!e)return;markStatus(id,done(e)?'Chưa bắt đầu':'Hoàn thành')}
function habitStatus(day,i){const override=(state.habitProgress[weekKey()]||{})[`${day}-${i}`];return override||HABIT_DEFAULTS[day][i]}
function cycleHabit(day,i){const s=habitStatus(day,i);const next=s==='Chưa'?'Xong':s==='Xong'?'N/A':'Chưa';(state.habitProgress[weekKey()] ||= {})[`${day}-${i}`]=next;save();render()}
function habitCounts(day=null){let done=0,total=0;for(let d=0;d<7;d++){if(day!==null&&day!==d)continue;for(let i=0;i<HABIT_NAMES.length;i++){let s=habitStatus(d,i);if(s!=='N/A'){total++;if(s==='Xong')done++}}}return {done,total}}
function toast(s){let n=document.getElementById('toastTarget');n.innerHTML=`<div class="toast">${h(s)}</div>`;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>n.innerHTML='',3000)}
function selectNav(v){view=v;render();window.scrollTo(0,0)}
function goWeek(delta){weekStart=new Date(weekStart);weekStart.setDate(weekStart.getDate()+delta*7);render()}
function goNow(){weekStart=monday(new Date());selectedDay=(new Date().getDay()+6)%7;render()}
function render(){document.getElementById('root').innerHTML=`<div class="app">${sidebar()}<main class="main">${topbar()}<div class="page">${view==='dashboard'?dashboard():view==='calendar'?calendar():view==='tasks'?tasks():view==='habits'?habits():settings()}</div></main>${mobileNav()}</div>`}
function sidebar(){let total=state.activities.length,finished=countDone(()=>true);return `<aside class="sidebar"><div class="logo"><div class="brand-icon">∿</div><div><div class="brand-title">Nhịp Tuần</div><div class="brand-sub">YOUR WEEK IN FLOW</div></div></div><div class="side-label">KHÔNG GIAN CỦA BẠN</div><div class="nav">${NAV.map(([id,label])=>`<button data-nav="${id}" class="${view===id?'active':''}"><span class="sym">${ICONS[id]}</span>${label}</button>`).join('')}</div><div class="side-bottom"><div class="helper"><strong>Tuần ${weekRange()}</strong><div style="margin-top:5px">${finished}/${total} hoạt động hoàn thành</div></div><div class="tinybar"><i style="width:${pct(finished,total)}%"></i></div><div class="helper">Tự động lưu trên thiết bị này.<br>Xuất bản sao tại Cài đặt.</div></div></aside>`}
function mobileNav(){return `<div class="mobile-nav">${NAV.map(([id,label])=>`<button data-nav="${id}" class="${view===id?'active':''}"><b>${ICONS[id]}</b>${label}</button>`).join('')}</div>`}
function topbar(){return `<header class="topbar"><div class="crumb">✳ <b>NHỊP TUẦN</b> <span>›</span> ${h(NAV.find(a=>a[0]===view)?.[1])}</div><div class="top-actions"><div class="week-controls"><button aria-label="Tuần trước" data-action="prev-week">‹</button><span class="week-text">${weekRange()}</span><button aria-label="Tuần sau" data-action="next-week">›</button></div><button class="btn slim" data-action="now">Tuần này</button><button class="btn primary" data-action="new">＋ <span>Thêm</span></button></div></header>`}
function hero(title,sub,aside=''){return `<div class="hero"><div><div class="eyebrow">HỌC TẬP · SỨC KHỎE · CUỘC SỐNG</div><h1>${title}</h1><p class="lede">${sub}</p></div>${aside}</div>`}
function metric(label,big,detail,icon,fill=null){return `<section class="metric"><div class="label">${label}<span class="emoji">${icon}</span></div><strong>${big}</strong><div class="detail">${detail}</div>${fill===null?'':`<div class="progress"><span style="width:${Math.min(100,Math.max(0,fill))}%"></span></div>`}</section>`}
function dashboard(){let campus=totalMinutes(e=>e.category==='Lớp học');let study=totalMinutes(e=>['Tự học','Nghiên cứu'].includes(e.category));let studyDone=totalMinutes(e=>['Tự học','Nghiên cứu'].includes(e.category),true);let nWorkout=state.activities.filter(e=>e.category==='Calisthenics').length;let workoutsDone=countDone(e=>e.category==='Calisthenics');let habits=habitCounts();let percent=pct(countDone(()=>true),state.activities.length);return `${hero('Một tuần chủ động, một ngày có nhịp.','Tổng quan kế hoạch và tiến độ thực tế. Giờ học cố định giữ nguyên từng phút; lịch mẫu lặp mỗi tuần, tiến độ được lưu riêng.',`<span class="status-chip">◉ ${countDone(()=>true)}/${state.activities.length} hoạt động xong</span>`)}<div class="grid4">${metric('LỚP HỌC TRÊN TRƯỜNG',`${fmtHours(campus)}h`,'10 ca học cố định','🎓')}${metric('TỰ HỌC & NGHIÊN CỨU',`${fmtHours(studyDone)}/${fmtHours(study)}h`,`Đã xong / kế hoạch · mục tiêu ${state.settings.studyGoal}h`,'📚',pct(studyDone,study))}${metric('CALISTHENICS',`${workoutsDone}/${nWorkout}`,`Mục tiêu ${state.settings.workoutGoal} buổi/tuần`,'💪',pct(workoutsDone,nWorkout))}${metric('TIẾN ĐỘ TUẦN',`${percent}%`,`${countDone(()=>true)} hoạt động hoàn thành`,'✳',percent)}</div><div class="twocol"><section class="panel"><div class="panel-head"><div><h2>Phân bổ theo ngày</h2><p>Tổng thời gian học / nghiên cứu, phần xanh đậm là đã hoàn thành</p></div><button class="mini-action" data-nav="calendar">Xem lịch →</button></div><div class="dailybars">${DAYS.map((d,i)=>{let p=totalMinutes(e=>e.day===i&&['Lớp học','Tự học','Nghiên cứu'].includes(e.category)),c=totalMinutes(e=>e.day===i&&['Lớp học','Tự học','Nghiên cứu'].includes(e.category),true);let cap=12*60;return `<div class="daybar" title="${h(d)}: ${fmtHours(p)} giờ học"><div class="barstack"><div class="barfill" style="height:${Math.max(1,p/cap*100)}%"><div class="donefill" style="height:${pct(c,p)}%"></div></div></div><label style="color:${isToday(i)?'#2f8f7a':''}">${SHORT[i]}</label></div>`}).join('')}</div><div class="legend"><span><i class="planned"></i> Kế hoạch</span><span><i></i> Hoàn thành</span></div></section><section class="panel"><div class="panel-head"><div><h2>${isToday(selectedDay)?'Việc của hôm nay':`Lịch ${DAYS[selectedDay]}`}</h2><p>${dateLabel(dateAt(selectedDay))} · ${dailyEvents(selectedDay).length} hoạt động</p></div><button class="mini-action" data-nav="tasks">Xem tất cả →</button></div>${dailyEvents(selectedDay).filter(e=>['Lớp học','Tự học','Nghiên cứu','Calisthenics','Việc nhà'].includes(e.category)).slice(0,7).map(agendaRow).join('')||'<div class="empty">Chưa có hoạt động.</div>'}</section></div><div class="twocol"><section class="panel"><div class="panel-head"><div><h2>Tiến độ theo nhóm</h2><p>Đánh dấu hoàn thành trong Công việc hoặc từ lịch</p></div></div>${['Lớp học','Tự học','Nghiên cứu','Calisthenics'].map(cat=>{let all=totalMinutes(e=>e.category===cat),yes=totalMinutes(e=>e.category===cat,true);return `<div style="margin:13px 0"><div style="display:flex;justify-content:space-between;font-size:12px;font-weight:750"><span>${cat}</span><span style="color:#8692a0">${fmtHours(yes)} / ${fmtHours(all)}h</span></div><div class="progress" style="margin-top:7px"><span style="width:${pct(yes,all)}%"></span></div></div>`}).join('')}</section><section class="panel"><div class="panel-head"><div><h2>Thói quen hằng ngày</h2><p>Hoàn thành ${habits.done}/${habits.total} mục tiêu trong tuần</p></div><button class="mini-action" data-nav="habits">Cập nhật →</button></div><div style="display:flex;align-items:center;gap:18px"><div style="height:110px;width:110px;flex:0 0 110px;display:grid;place-items:center;border-radius:50%;background:conic-gradient(#3a9c85 ${pct(habits.done,habits.total)}%,#edf2f5 0);"><div style="display:grid;place-items:center;background:white;border-radius:50%;height:79px;width:79px;font-size:22px;font-weight:800">${pct(habits.done,habits.total)}%</div></div><p style="font-size:12px;line-height:1.8;color:#68778a">Giữ nhịp với tưới cây, việc nhà, tự học, vận động và ngủ đủ giấc.<br><b style="color:#2d9177">N/A không tính vào mục tiêu.</b></p></div></section></div>`}
function agendaRow(e){let completed=done(e);return `<div class="agenda-item"><div class="agenda-time">${h(e.start)}<br>${h(e.end)}</div><div class="agenda-body"><div class="agenda-title">${h(e.title)}</div><div class="agenda-sub"><span class="dot"></span>${h(e.category)}${e.place?` · ${h(e.place)}`:''}${e.description?` · ${h(e.description)}`:''}</div></div><button aria-label="Đánh dấu hoàn thành" title="${completed?'Bỏ hoàn thành':'Đánh dấu hoàn thành'}" class="tick ${completed?'done':''}" data-toggle="${h(e.id)}">✓</button></div>`}
function calendar(){let catLegend=CATEGORIES.filter(x=>['Lớp học','Tự học','Nghiên cứu','Calisthenics','Việc nhà'].includes(x)).map(x=>`<span class="cat-${CAT_CLASS[x]} cat-pill">${x}</span>`).join('');return `${hero('Thời khóa biểu 7 ngày','Khung 45 phút từ 06:00 đến 22:30 và 30 phút cuối đến 23:00. Hoạt động được đặt đúng giờ bắt đầu/kết thúc thực tế.')}
<div class="section-tools"><div class="segmented"><button class="${calendarMode==='week'?'active':''}" data-calendar-mode="week">▦ Tuần</button><button class="${calendarMode==='day'?'active':''}" data-calendar-mode="day">☷ Theo ngày</button></div><span style="font-size:11px;color:#8895a5">Nhấn vào hoạt động để chỉnh sửa</span></div>${calendarMode==='week'?calendarGrid():`${dayChips()}<section class="panel day-agenda">${dailyEvents(selectedDay).map(agendaRowEditable).join('')||'<div class="empty">Chưa có hoạt động.</div>'}</section>`}<div class="cat-legend">${catLegend}</div>`}
function dayChips(){return `<div class="day-pills">${DAYS.map((d,i)=>`<button class="${selectedDay===i?'active':''} ${isToday(i)?'today':''}" data-day="${i}">${SHORT[i]}<span style="display:block;font-size:10px;opacity:.7">${dateLabel(dateAt(i))}</span></button>`).join('')}</div>`}
function agendaRowEditable(e){return `<div class="agenda-item"><div class="agenda-time">${h(e.start)}<br>${h(e.end)}</div><div class="agenda-body"><button style="border:0;background:none;padding:0;text-align:left" data-edit="${h(e.id)}"><div class="agenda-title">${h(e.title)}</div></button><div class="agenda-sub">${h(e.category)}${e.place?` · ${h(e.place)}`:''}${e.description?` · ${h(e.description)}`:''}</div></div><button class="tick ${done(e)?'done':''}" data-toggle="${h(e.id)}" aria-label="Đánh dấu">✓</button></div>`}
function calendarGrid(){const SLOT_H=62,START=360,END=1380,HEIGHT=(END-START)/45*SLOT_H;const ticks=[];for(let m=START;m<=END;m+=45)ticks.push(m);if(ticks.at(-1)!==END)ticks.push(END);const timeText=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;let rails=ticks.map(m=>`<div class="time-tick" style="top:${(m-START)/45*SLOT_H}px;height:${SLOT_H}px">${timeText(m)}</div>`).join('');return `<div class="schedule-wrap"><div class="schedule"><div class="schedule-header" style="position:sticky;left:0;z-index:6">GIỜ</div>${DAYS.map((x,i)=>`<div class="schedule-header ${isToday(i)?'today':''}">${SHORT[i]} · ${dateLabel(dateAt(i))}</div>`).join('')}<div class="time-rail" style="height:${HEIGHT}px">${rails}</div>${DAYS.map((d,i)=>`<div class="day-lane ${isToday(i)?'today':''}" style="height:${HEIGHT}px">${dailyEvents(i).map(e=>{let pos=(mins(e.start)-START)/45*SLOT_H,hh=duration(e)/45*SLOT_H;let micro=hh<35;return `<button data-edit="${h(e.id)}" class="event cat-${CAT_CLASS[e.category]||'life'} ${micro?'micro':''} ${done(e)?'done':''}" style="top:${pos+2}px;height:${Math.max(9,hh-3)}px" title="${h(`${e.start}–${e.end} ${e.title}${e.place?' · '+e.place:''}`)}"><div class="ev-time">${h(e.start)}–${h(e.end)}</div><div class="ev-title">${h(e.title)}</div>${hh>83?`<div class="ev-time">${h(e.place||e.category)}</div>`:''}</button>`}).join('')}</div>`).join('')}</div></div>`}
function tasks(){let items=state.activities.filter(e=>(taskCategory==='Tất cả'||taskCategory===e.category)&&(taskStatus==='Tất cả'||taskStatus===activeStatus(e))&&`${e.title} ${e.description} ${e.place}`.toLocaleLowerCase('vi').includes(taskSearch.toLocaleLowerCase('vi'))).sort((a,b)=>a.day-b.day||mins(a.start)-mins(b.start));return `${hero('Danh sách hoạt động','Thêm, sửa, xóa hoạt động trong lịch mẫu. Trạng thái hoàn thành chỉ áp dụng cho tuần đang chọn.')}
<div class="filter-row"><input id="searchTasks" placeholder="⌕  Tìm theo tên môn, nội dung, phòng học…" value="${h(taskSearch)}"><select id="categoryFilter">${['Tất cả',...CATEGORIES].map(c=>`<option ${c===taskCategory?'selected':''}>${c}</option>`).join('')}</select><select id="statusFilter">${['Tất cả','Chưa bắt đầu','Đang làm','Hoàn thành'].map(c=>`<option ${c===taskStatus?'selected':''}>${c}</option>`).join('')}</select><span style="font-size:12px;color:#768799">${items.length} hoạt động</span></div><div class="task-list">${items.map(e=>`<div class="task-row ${done(e)?'is-done':''}"><button class="tick ${done(e)?'done':''}" data-toggle="${h(e.id)}" aria-label="Đánh dấu">✓</button><div class="task-time">${SHORT[e.day]}<br>${h(e.start)}–${h(e.end)}</div><div><div class="task-title">${h(e.title)}</div><div class="task-meta">${h(e.place||e.category)}${e.description?` · ${h(e.description)}`:''}</div></div><div class="task-category"><span class="cat-pill cat-${CAT_CLASS[e.category]||'life'}">${h(e.category)}</span></div><button class="edit" data-edit="${h(e.id)}">Sửa ›</button></div>`).join('')||'<div class="empty">Không có hoạt động phù hợp.</div>'}</div>`}
function habits(){const stats=habitCounts();return `${hero('Những thói quen nhỏ, kết quả lớn','Bấm để chuyển trạng thái theo vòng: Chưa → Xong → N/A. N/A là ngày không đặt mục tiêu.')}
<div class="habit-summary">${DAYS.map((d,i)=>{let c=habitCounts(i);return `<div class="habit-card"><b>${pct(c.done,c.total)}%</b><span>${SHORT[i]} · ${c.done}/${c.total}</span></div>`}).join('')}</div><section class="panel"><div class="panel-head"><div><h2>Bảng kiểm thói quen</h2><p>Đã hoàn thành ${stats.done}/${stats.total} mục tiêu tuần</p></div><span class="status-chip">${pct(stats.done,stats.total)}%</span></div><p style="font-size:11px;color:#8a96a5;margin:-8px 0 14px">Trên điện thoại, vuốt ngang bảng để xem các ngày →</p><div class="habit-wrap"><table class="habit-table"><thead><tr><th>Thói quen</th>${DAYS.map((d,i)=>`<th>${SHORT[i]}<br><small>${dateLabel(dateAt(i))}</small></th>`).join('')}</tr></thead><tbody>${HABIT_NAMES.map((name,j)=>`<tr><td>${h(name)}</td>${DAYS.map((d,i)=>{const s=habitStatus(i,j);return `<td><button class="habit-button ${s==='Xong'?'done':s==='N/A'?'na':''}" data-habit="${i},${j}" title="${h(s)}">${s==='Xong'?'✓':s==='N/A'?'–':'○'}</button></td>`}).join('')}</tr>`).join('')}</tbody></table></div></section><p class="lede" style="margin-top:16px">Mẹo: Nếu hôm đó không cần quét nhà hoặc phơi đồ, đặt N/A để giữ tỷ lệ hoàn thành đúng với thực tế.</p>`}
function settings(){return `${hero('Cài đặt & sao lưu','Mọi dữ liệu được lưu trong trình duyệt trên thiết bị này. Không cần tài khoản, không gửi thông tin lên máy chủ.')}
<div class="settings-grid"><section class="panel"><div class="panel-head"><div><h2>Mục tiêu tuần</h2><p>Điều chỉnh cho phù hợp sức học và phục hồi</p></div></div><form id="goalsForm" class="form-grid"><label class="field">Mục tiêu tự học / nghiên cứu (giờ/tuần)<input type="number" name="studyGoal" min="1" max="100" step=".5" value="${h(state.settings.studyGoal)}" required></label><label class="field">Mục tiêu Calisthenics (buổi/tuần)<input type="number" name="workoutGoal" min="0" max="7" step="1" value="${h(state.settings.workoutGoal)}" required></label><div class="field full"><button class="btn primary" type="submit">Lưu mục tiêu</button></div></form><p class="lede">Lịch hiện có ${fmtHours(totalMinutes(e=>['Tự học','Nghiên cứu'].includes(e.category)))} giờ tự học và ${state.activities.filter(e=>e.category==='Calisthenics').length} buổi tập mỗi tuần.</p></section><section class="panel"><div class="panel-head"><div><h2>Dữ liệu của bạn</h2><p>Xuất, nhập và bảo vệ bản kế hoạch</p></div></div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-bottom:16px"><button class="btn primary" data-action="backup">↓ Sao lưu JSON</button><button class="btn" data-action="csv">↓ Lịch CSV</button><label class="btn" for="importFile" style="cursor:pointer">↑ Khôi phục JSON</label><input type="file" id="importFile" accept=".json,application/json" style="display:none"></div><div class="notice">Dữ liệu tiến độ được tách theo từng tuần. Việc chỉnh sửa hoặc xóa một hoạt động sẽ thay đổi lịch mẫu ở tất cả các tuần.</div></section><section class="panel"><div class="panel-head"><div><h2>Làm mới</h2><p>Khôi phục mẫu hoặc xóa dấu hoàn thành</p></div></div><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-action="reset-week">Làm mới tiến độ tuần này</button><button class="btn warn" data-action="reset-all">Khôi phục toàn bộ lịch gốc</button></div><p class="lede" style="margin-top:18px">Hãy sao lưu JSON trước khi đặt lại dữ liệu.</p></section><section class="panel"><div class="panel-head"><div><h2>Về Nhịp Tuần</h2><p>Phiên bản 1.0 · chạy độc lập</p></div></div><p style="font-size:12px;color:#687b8f;line-height:1.8">Ứng dụng đã nhập đủ <b>${SEED_ACTIVITIES.length} hoạt động</b> từ file Excel, gồm <b>10 ca học cố định</b> giữ đúng giờ và phòng học. Trên điện thoại, hãy mở bằng trình duyệt và chọn <b>Thêm vào màn hình chính</b> sau khi triển khai ứng dụng lên một địa chỉ HTTPS.</p><div class="notice note-warning" style="margin-top:14px"><b>Giới hạn:</b> dữ liệu hiện không tự đồng bộ với Google Sheets và không tự truyền giữa hai thiết bị. Hãy dùng chức năng sao lưu/khôi phục để chuyển dữ liệu.</div></section></div>`}
function openEditor(id=null){modalId=id;let e=id?state.activities.find(x=>x.id===id):null;const x=e||{day:selectedDay,start:'18:00',end:'18:45',title:'',category:'Tự học',place:'',priority:'Bình thường',description:''};document.body.insertAdjacentHTML('beforeend',`<div class="modal-shade" id="modalShade"><div class="modal" role="dialog" aria-modal="true" aria-label="Chỉnh sửa hoạt động"><div class="modal-head"><h2>${e?'Sửa hoạt động':'Thêm hoạt động mới'}</h2><button class="btn slim" data-action="close-modal" aria-label="Đóng">✕</button></div><form id="eventForm"><div class="form-grid"><label class="field full">Tên hoạt động<input name="title" value="${h(x.title)}" required maxlength="150" placeholder="Ví dụ: Luyện bài tập Cơ học"></label><label class="field">Ngày<select name="day">${DAYS.map((d,i)=>`<option value="${i}" ${Number(x.day)===i?'selected':''}>${d}</option>`).join('')}</select></label><label class="field">Nhóm hoạt động<select name="category">${CATEGORIES.map(c=>`<option ${x.category===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Giờ bắt đầu<input name="start" type="time" min="06:00" max="22:59" required value="${h(x.start)}"></label><label class="field">Giờ kết thúc<input name="end" type="time" min="06:01" max="23:00" required value="${h(x.end)}"></label><label class="field">Phòng / địa điểm<input name="place" value="${h(x.place)}" placeholder="Tại nhà, D6-208…"></label><label class="field">Ưu tiên<select name="priority"><option ${x.priority==='Bình thường'?'selected':''}>Bình thường</option><option ${x.priority==='Cao'?'selected':''}>Cao</option><option ${x.priority==='Thấp'?'selected':''}>Thấp</option></select></label><label class="field full">Mục tiêu / ghi chú<textarea name="description" maxlength="500">${h(x.description)}</textarea></label><label class="field full">Trạng thái tuần này<select name="status">${['Chưa bắt đầu','Đang làm','Hoàn thành'].map(s=>`<option ${((e?activeStatus(e):'Chưa bắt đầu')===s)?'selected':''}>${s}</option>`).join('')}</select></label></div><div id="formError" style="color:#b94640;font-size:12px;margin-top:13px"></div><div class="modal-actions"><div>${e?`<button type="button" class="btn warn" data-action="delete">Xóa hoạt động</button>`:''}</div><div style="display:flex;gap:7px"><button type="button" class="btn" data-action="close-modal">Hủy</button><button type="submit" class="btn primary">${e?'Lưu thay đổi':'Thêm hoạt động'}</button></div></div></form></div></div>`);document.getElementById('eventForm').elements.title.focus()}
function closeEditor(){document.getElementById('modalShade')?.remove();modalId=null}
function submitEvent(form){const data=Object.fromEntries(new FormData(form));const start=mins(data.start),end=mins(data.end);if(!(start>=360&&end<=1380&&end>start)){document.getElementById('formError').textContent='Giờ bắt đầu/kết thúc phải trong 06:00–23:00 và giờ kết thúc phải muộn hơn giờ bắt đầu.';return}let id=modalId||`custom-${Date.now()}-${Math.random().toString(36).slice(2,7)}`;let event={id,day:Number(data.day),start:data.start,end:data.end,category:data.category,title:data.title.trim(),description:data.description.trim(),place:data.place.trim(),priority:data.priority};if(!event.title)return;const overlap=state.activities.find(x=>x.id!==id&&x.day===event.day&&mins(x.start)<end&&mins(x.end)>start);if(overlap&&!confirm(`Khoảng giờ trùng với “${overlap.title}” (${overlap.start}–${overlap.end}). Vẫn lưu hoạt động này?`))return;const idx=state.activities.findIndex(x=>x.id===id);if(idx<0)state.activities.push(event);else state.activities[idx]=event;(state.progress[weekKey()]||={})[id]=data.status;save();closeEditor();render();toast(idx<0?'Đã thêm hoạt động.':'Đã cập nhật hoạt động.')}
function deleteEvent(){const e=state.activities.find(x=>x.id===modalId);if(!e)return;if(e.category==='Lớp học'&&!confirm('Đây là tiết học cố định trên trường. Bạn chắc chắn muốn xóa?'))return;if(!confirm(`Xóa “${e.title}” khỏi lịch mẫu của mọi tuần?`))return;state.activities=state.activities.filter(x=>x.id!==modalId);save();closeEditor();render();toast('Đã xóa hoạt động.')}
function downloadFile(name,content,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function toCSV(){let cols=['Ngày','Bắt đầu','Kết thúc','Nhóm','Hoạt động','Mô tả','Phòng / địa điểm','Ưu tiên','Trạng thái tuần này'];let esc=x=>'"'+String(x??'').replaceAll('"','""')+'"';let lines=[cols,...state.activities.slice().sort((a,b)=>a.day-b.day||mins(a.start)-mins(b.start)).map(e=>[DAYS[e.day],e.start,e.end,e.category,e.title,e.description,e.place,e.priority,activeStatus(e)])];downloadFile(`nhip-tuan-${weekKey()}.csv`,'\uFEFF'+lines.map(line=>line.map(esc).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function backup(){downloadFile(`nhip-tuan-backup-${keyDate(new Date())}.json`,JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json')}
async function importFile(file){if(!file)return;try{const j=JSON.parse(await file.text());if(!Array.isArray(j.activities)||!j.activities.every(e=>typeof e.id==='string'&&Number.isInteger(e.day)&&e.day>=0&&e.day<=6&&typeof e.start==='string'&&/^\d\d:\d\d$/.test(e.start)&&typeof e.end==='string'&&/^\d\d:\d\d$/.test(e.end)&&typeof e.title==='string')||!j.progress||!j.habitProgress)throw Error('Cấu trúc bản sao không hợp lệ');if(!confirm(`Nhập ${j.activities.length} hoạt động và thay thế toàn bộ dữ liệu hiện tại?`))return;state={...defaultData(),...j};save();render();toast('Đã khôi phục từ bản sao.')}catch(e){alert('Không đọc được bản sao: '+e.message)}}
function act(s){if(s==='prev-week')goWeek(-1);if(s==='next-week')goWeek(1);if(s==='now')goNow();if(s==='new')openEditor();if(s==='close-modal')closeEditor();if(s==='delete')deleteEvent();if(s==='backup')backup();if(s==='csv')toCSV();if(s==='reset-week'){if(confirm('Xóa dấu hoàn thành và các thói quen đã đánh dấu trong tuần này?')){delete state.progress[weekKey()];delete state.habitProgress[weekKey()];save();render();toast('Đã làm mới tiến độ tuần này.')}}if(s==='reset-all'){if(confirm('Khôi phục toàn bộ 114 hoạt động gốc và XÓA tất cả tiến độ/thói quen?')){state=defaultData();save();render();toast('Đã khôi phục lịch gốc.')}}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-nav],[data-action],[data-edit],[data-toggle],[data-day],[data-habit],[data-calendar-mode]');if(t){if(t.dataset.nav)selectNav(t.dataset.nav);if(t.dataset.action)act(t.dataset.action);if(t.dataset.edit)openEditor(t.dataset.edit);if(t.dataset.toggle)toggleTask(t.dataset.toggle);if(t.dataset.day!==undefined){selectedDay=Number(t.dataset.day);render()}if(t.dataset.habit){const [day,i]=t.dataset.habit.split(',').map(Number);cycleHabit(day,i)}if(t.dataset.calendarMode){calendarMode=t.dataset.calendarMode;render()}}if(e.target.id==='modalShade')closeEditor()});
document.addEventListener('change',e=>{if(e.target.id==='categoryFilter'){taskCategory=e.target.value;render()}if(e.target.id==='statusFilter'){taskStatus=e.target.value;render()}if(e.target.id==='importFile'){importFile(e.target.files?.[0])}});
document.addEventListener('input',e=>{if(e.target.id==='searchTasks'){let v=e.target.value;taskSearch=v;let start=e.target.selectionStart;render();let n=document.getElementById('searchTasks');n?.focus();n?.setSelectionRange(start,start)}});
document.addEventListener('submit',e=>{if(e.target.id==='eventForm'){e.preventDefault();submitEvent(e.target)}if(e.target.id==='goalsForm'){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));state.settings.studyGoal=Number(x.studyGoal);state.settings.workoutGoal=Number(x.workoutGoal);save();render();toast('Đã cập nhật mục tiêu tuần.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modalShade'))closeEditor()});
if('serviceWorker' in navigator&&location.protocol!=='file:'){addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body></html>
